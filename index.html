<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb Cover Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- one link per family so a single failure can't block the rest -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap">
<link rel="stylesheet" href="ui/editor.css">
</head>
<body>
<main class="stage">
  <div class="topbar">
    <div class="brand">my inbetweens <span>· cover engine</span></div>
    <select id="preset" title="Presets"></select>
    <button class="btn icon" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  </div>
  <div class="canvaswrap"><canvas id="c" width="1600" height="1600"></canvas></div>
  <div class="transport">
    <button class="btn icon" id="play" title="Play / pause (Space)">❚❚</button>
    <input type="range" id="scrub" min="0" max="1" step="0.0005" value="0" aria-label="Time">
    <span class="time" id="time">0.00 / 12s</span>
    <button class="btn icon" id="prevStyle" title="Previous style (←)">‹</button>
    <button class="btn icon" id="nextStyle" title="Next style (→)">›</button>
  </div>
  <div class="exportbar">
    <select id="size" title="Export size">
      <option value="1080">1080 px</option>
      <option value="1600">1600 px</option>
      <option value="3000" selected>3000 px</option>
      <option value="4000">4000 px</option>
    </select>
    <button class="btn primary" id="png">Save PNG</button>
    <button class="btn" id="rec">Record loop</button>
    <span class="sep"></span>
    <button class="btn" id="saveJson">Save settings</button>
    <button class="btn" id="loadJson">Load settings</button>
    <input type="file" id="jsonFile" accept=".json,application/json" hidden>
    <button class="btn" id="copyJson">Copy JSON</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</main>
<aside id="panel" aria-label="Settings"></aside>
<div class="toast" id="toast"></div>
<script type="module" src="main.js"></script>
</body>
</html>
